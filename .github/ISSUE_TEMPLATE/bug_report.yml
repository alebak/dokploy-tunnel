name: Bug Report
description: Report something in dokploy-tunnel that does not work as documented
labels: ["bug"]

body:
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - doktunnel CLI
        - doktunnel-companion
        - Install scripts
        - Other
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `doktunnel --version` (and the companion version if relevant).
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - Linux
        - Windows
        - macOS
    validations:
      required: true

  - type: input
    id: dokploy
    attributes:
      label: Dokploy Version
    validations:
      required: false

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Commands run, in order. Remove API keys, hostnames and private URLs.
      render: shell
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: Include the error code and the output of the failing command with `--json` if possible.
    validations:
      required: true
